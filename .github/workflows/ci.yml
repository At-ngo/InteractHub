name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        run: |
          dotnet restore InteractHub.API/InteractHub.API.csproj
          dotnet build InteractHub.API/InteractHub.API.csproj -c Release --no-restore

      - name: Run tests
        run: |
          dotnet test InteractHub.Tests/InteractHub.Tests.csproj -c Release --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps & build
        working-directory: ./interacthub-frontend
        run: |
          npm ci
          npm run build