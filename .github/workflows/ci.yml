name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # 1. Build & Test Backend (.NET)
  # ─────────────────────────────────────────
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore InteractHub.API/InteractHub.API.csproj

      - name: Build
        run: dotnet build InteractHub.API/InteractHub.API.csproj -c Release --no-restore

      - name: Run unit tests
        run: dotnet test InteractHub.Tests/InteractHub.Tests.csproj -c Release --no-build --verbosity normal

  # ─────────────────────────────────────────
  # 2. Build Frontend (React / Vite)
  # ─────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: interacthub-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./interacthub-frontend
        run: npm ci

      - name: Build
        working-directory: ./interacthub-frontend
        run: npm run build
        env:
          # Vercel sẽ inject VITE_API_URL khi deploy, nhưng CI cần giá trị
          # placeholder để build không bị lỗi thiếu env.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://placeholder.onrender.com' }}
