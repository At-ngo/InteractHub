name: CD

on:
  push:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # 1. Deploy Backend → Render
  # ─────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        # Render tự build & deploy khi nhận POST đến deploy hook URL.
        # Thêm secret RENDER_DEPLOY_HOOK_URL vào GitHub repository secrets.
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP status: %{http_code}\n"

  # ─────────────────────────────────────────
  # 2. Deploy Frontend → Vercel
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./interacthub-frontend

      - name: Build project (Vercel)
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./interacthub-frontend

      - name: Deploy to Vercel (production)
        run: |
          vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./interacthub-frontend
