name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy-azure-appservice:
    runs-on: ubuntu-latest
    if: github.event.pusher != null && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: |
          dotnet publish InteractHub.API/InteractHub.API.csproj -c Release -o out
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v4
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./InteractHub.API/out

  # Alternative: push images to a container registry and deploy via container service (ECS/AKS)
